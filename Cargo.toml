[package]
name = "open-network-monitor"
version = "0.3.4"
edition = "2024"
rust-version = "1.95"
description = "Local-first Windows network usage monitor built with Rust and egui"
license = "MIT"

[[bin]]
name = "OpenNetworkMonitor"
path = "src/main.rs"
test = false

[features]
ui-preview = []

[[example]]
name = "ui_preview"
path = "examples/ui_preview.rs"
required-features = ["ui-preview"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit"] }
maxminddb = "0.26"
rfd = "0.17"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
tray-icon = "0.21"
windows = { version = "0.62.2", features = ["Networking_Connectivity", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Registry", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Etw", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.clippy]
undocumented_unsafe_blocks = "warn"


[dev-dependencies]
tempfile = "3"
